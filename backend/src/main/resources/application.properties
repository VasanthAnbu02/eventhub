# Application name. Matters: identifies this service in logs and Actuator info.
spring.application.name=backend

# ---------------------------------------------------------------------------
# Load local environment values from backend/.env (if present).
# Path is relative to the working directory, so run the app from the backend folder.
# "optional:" means startup doesn't fail because the file is missing; the
# ${...} placeholders below still fail fast if a value isn't provided anywhere.
# OS environment variables take precedence over values in .env.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]
server.port=8081
# ---------------------------------------------------------------------------
# PostgreSQL datasource (environment-based, no hardcoded credentials).
# Required variables (from the OS environment or backend/.env):
#   SPRING_DATASOURCE_URL       - JDBC URL, e.g. jdbc:postgresql://localhost:5432/eventhub
#   SPRING_DATASOURCE_USERNAME  - database username
#   SPRING_DATASOURCE_PASSWORD  - database password (never commit real values)
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate (development-appropriate, no schema generation).
# ddl-auto=validate: Hibernate must NOT create or alter tables; it only validates.
# jdbc.time_zone=UTC: timezone-aware timestamps are required.
# open-in-view=false: avoids lazy-loading in the web layer; business rules
# belong in the service layer, not controllers.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false